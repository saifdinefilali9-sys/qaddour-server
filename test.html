<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>اختبارقدور</title>
</head>
<body>

<h2>اختبار اتصال قدور</h2>

<button onclick="testQaddour()">اختبار</button>

<pre id="result">لم يتم الاختبار بعد</pre>

<script>
async function testQaddour() {
  const result = document.getElementById("result");

  result.textContent = "جاري الاختبار...";

  try {
    const response = await fetch(
      "https://qaddour-server.vercel.app/ask",
      {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          message: "قل مرحبا"
        })
      }
    );

    const data = await response.json();

    result.textContent =
      "HTTP: " + response.status +
      "\n\n" +
      JSON.stringify(data, null, 2);

  } catch (error) {
    result.textContent =
      "خطأ:\n" + error.message;
  }
}
</script>

</body>
</html>
